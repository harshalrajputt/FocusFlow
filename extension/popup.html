<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FocusFlow Companion</title>
    <style>
        body {
            width: 320px;
            margin: 0;
            background: #020817;
            color: #f1f5f9;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.08);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .logo {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            color: white;
        }

        .brand-name {
            font-weight: 800;
            font-size: 14px;
            letter-spacing: -0.3px;
        }

        .card {
            background: #0d1526;
            border: 1px solid rgba(148, 163, 184, 0.07);
            border-radius: 14px;
            padding: 16px;
        }

        /* Forms */
        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            background: #0a1628;
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 12px;
            padding: 8px 12px;
            outline: none;
            box-sizing: border-box;
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: white;
            border: none;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
            margin-top: 8px;
        }

        .btn-secondary {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            background: transparent;
            color: #94a3b8;
            border: 1px solid #1e293b;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            margin-top: 6px;
        }

        /* Timer layout */
        .timer-display {
            font-family: monospace;
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            letter-spacing: -1px;
        }

        .timer-status {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-bottom: 14px;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: #1e293b;
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-play {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
            width: 50px;
            height: 50px;
        }

        .error-msg {
            color: #f87171;
            font-size: 11px;
            margin-bottom: 8px;
        }

        .mode-row {
            display: flex;
            gap: 4px;
            background: #0a1628;
            padding: 3px;
            border-radius: 8px;
            margin-bottom: 14px;
        }

        .mode-btn {
            flex: 1;
            padding: 6px;
            font-size: 10px;
            font-weight: 600;
            border: none;
            background: transparent;
            color: #64748b;
            border-radius: 6px;
            cursor: pointer;
        }

        .mode-btn.active {
            background: rgba(124, 58, 237, 0.15);
            color: #c4b5fd;
            border: 1px solid rgba(124, 58, 237, 0.3);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo">⚡</div>
        <span class="brand-name">Focus<span style="color:#a78bfa;">Flow</span> Companion</span>
    </div>

    <!-- Screen 1: Auth Screen -->
    <div id="auth-screen" style="display: none;">
        <div class="card">
            <h3 style="margin-top:0;font-size:14px;color:#cbd5e1;">Sync with Web App</h3>
            <div id="login-error" class="error-msg" style="display:none;"></div>
            
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@example.com">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            
            <button id="login-btn" class="btn-primary">Connect Account</button>
        </div>
    </div>

    <!-- Screen 2: Timer Screen -->
    <div id="timer-screen" style="display: none;">
        <div class="card">
            <!-- Modes -->
            <div class="mode-row">
                <button id="mode-focus" class="mode-btn active">Focus</button>
                <button id="mode-short" class="mode-btn">Short Break</button>
                <button id="mode-long" class="mode-btn">Long Break</button>
            </div>

            <!-- Timer Display -->
            <div id="timer" class="timer-display">25:00</div>
            <div id="status" class="timer-status">Distraction blocker: inactive</div>

            <!-- Controls -->
            <div class="controls-row">
                <button id="reset-btn" class="btn-circle">⏱</button>
                <button id="play-btn" class="btn-circle btn-play">▶</button>
                <button id="skip-btn" class="btn-circle">➔</button>
            </div>

            <!-- Task Target -->
            <div class="form-group">
                <label>Focus Target Task</label>
                <select id="task-select">
                    <option value="">General Focus</option>
                </select>
            </div>

            <!-- Settings Accordion Toggle -->
            <button id="toggle-settings-btn" class="btn-secondary">⚙ Configure Settings</button>

            <!-- Collapsible Settings Panel -->
            <div id="settings-panel" style="display: none; margin-top: 12px; border-top: 1px solid rgba(148, 163, 184, 0.08); padding-top: 12px;">
                <h4 style="margin: 0 0 8px 0; font-size: 11px; text-transform: uppercase; color: #a78bfa; letter-spacing: 0.5px;">Custom Durations (mins)</h4>
                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <div style="flex: 1;">
                        <label>Focus</label>
                        <input type="number" id="cfg-focus-time" min="1" max="180" style="width: 100%;">
                    </div>
                    <div style="flex: 1;">
                        <label>Short</label>
                        <input type="number" id="cfg-short-time" min="1" max="60" style="width: 100%;">
                    </div>
                    <div style="flex: 1;">
                        <label>Long</label>
                        <input type="number" id="cfg-long-time" min="1" max="120" style="width: 100%;">
                    </div>
                </div>

                <h4 style="margin: 0 0 2px 0; font-size: 11px; text-transform: uppercase; color: #a78bfa; letter-spacing: 0.5px;">Distraction Blocklist</h4>
                <p style="font-size: 9px; color: #64748b; margin: 0 0 6px 0;">Comma-separated domains to block</p>
                <div class="form-group">
                    <textarea id="cfg-blocked-sites" rows="2" style="width: 100%; background: #0a1628; border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 8px; color: #f1f5f9; font-size: 11px; padding: 6px; box-sizing: border-box; resize: vertical; font-family: inherit; outline: none;"></textarea>
                </div>

                <h4 style="margin: 0 0 2px 0; font-size: 11px; text-transform: uppercase; color: #a78bfa; letter-spacing: 0.5px;">Useful Whitelist</h4>
                <p style="font-size: 9px; color: #64748b; margin: 0 0 6px 0;">Domains to never block (e.g. google.com)</p>
                <div class="form-group">
                    <textarea id="cfg-allowed-sites" rows="2" style="width: 100%; background: #0a1628; border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 8px; color: #f1f5f9; font-size: 11px; padding: 6px; box-sizing: border-box; resize: vertical; font-family: inherit; outline: none;"></textarea>
                </div>

                <button id="save-settings-btn" class="btn-primary" style="margin-top: 4px;">Save Configs</button>
            </div>

            <button id="logout-btn" class="btn-secondary" style="margin-top: 12px;">Disconnect Account</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
