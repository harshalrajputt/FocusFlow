<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay Focused — FocusFlow</title>
    <style>
        body {
            margin: 0;
            background: #020817;
            color: #f1f5f9;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .container {
            max-width: 480px;
            padding: 40px;
            border-radius: 24px;
            background: #0d1526;
            border: 1px solid rgba(148, 163, 184, 0.08);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 10;
        }

        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.15) 0%, transparent 70%);
            filter: blur(40px);
            z-index: 1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 24px;
            display: inline-block;
            animation: float 4s ease-in-out infinite;
        }

        h1 {
            font-size: 28px;
            font-weight: 900;
            margin: 0 0 12px 0;
            background: linear-gradient(135deg, #a78bfa, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 14px;
            color: #64748b;
            line-height: 1.6;
            margin: 0 0 28px 0;
        }

        .quote {
            font-style: italic;
            font-size: 13px;
            color: #94a3b8;
            border-left: 2px solid #7c3aed;
            padding-left: 14px;
            text-align: left;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.3);
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.5);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <span class="icon">⚡</span>
        <h1>Focus Flow is Active</h1>
        <p>This website was blocked by FocusFlow because it is listed as one of your biggest distractions. Put down the distraction and get back to what matters.</p>
        
        <div class="quote">
            "Your focus determines your reality." — Qui-Gon Jinn
        </div>

        <a href="http://localhost:5174/focus" target="_blank" class="btn">
            Open FocusFlow Timer →
        </a>
    </div>
</body>
</html>
